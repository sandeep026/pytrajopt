[tool.poetry]
name = "pytrajopt"
version = "0.1.4"
description = "A minimal python package to solve multiphase and single phase optimal control problems using direct multiple shooting and collocation."
authors = ["R Sandeepkumar"]
license = "LGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/sandeep026/pytrajopt"
homepage = "https://sandeep026.github.io/pytrajopt/"
keywords = [
    "optimal-control",
    "trajectory-optimization",
    "casadi",
    "collocation",
    "multiple-shooting",
]


[tool.poetry.dependencies]
python = "^3.12"
casadi = "^3.8.2"
scipy = "^1.18.1"
pydantic = "^2.14.1"
matplotlib = "^3.11.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "zensical (>=0.0.70,<0.0.71)",
    "mkdocs-autoapi (>=0.4.1,<0.5.0)",
    "mkdocstrings-python (>=2.0.9,<3.0.0)",
]
